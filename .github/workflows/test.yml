name: Run Pytest with Postgres

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    # Spin up a temporary PostgreSQL database container
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        # Ensure postgres is healthy before running the steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest python-dotenv psycopg2-binary pandas sqlalchemy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Create database schema and tables
      env:
        PGPASSWORD: postgres_password
      run: |
        Initialize the official schema and tables from your SQL script
        psql -h localhost -U postgres -d test_db -f tests/resources/schema.sql
        
        Append the CSV data into the pre-existing structured table
        python -c "
        import pandas as pd
        from sqlalchemy import create_engine
        
        # Read raw CSV
        df = pd.read_csv('tests/resources/players.csv')
        
        # Clean column names to match the exact schema structure
        df.columns = df.columns.str.strip().str.lower().str.replace(' ', '_')
        
        # Drop 'player_id' if it exists in raw CSV so Postgres can auto-generate it
        if 'player_id' in df.columns:
            df = df.drop(columns=['player_id'])
        
        db_url = 'postgresql://postgres:postgres_password@localhost:5432/test_db'
        engine = create_engine(db_url)
        
        # Append rows to the existing table instead of 'replace'
        df.to_sql('players', engine, schema='worldcup26', if_exists='append', index=False)
        print('CSV data successfully appended to the structured schema!')
        "

    - name: Run tests with pytest
      # Inject the unified DATABASE_URL and force local development mode
      env:
        PYTHONPATH: .
        ENV_MODE: development
        DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/test_db
      run: |
        pytest
