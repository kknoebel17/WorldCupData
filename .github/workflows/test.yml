name: Run Pytest with Postgres

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Spin up a temporary PostgreSQL database container
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        # Ensure postgres is healthy before running the steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest python-dotenv psycopg2-binary
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install PostgreSQL client and dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client
        pip install pandas sqlalchemy psycopg2-binary

    - name: Create database schema and tables
      env:
        PGPASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        # Ensure the target schema exists
        psql -h localhost -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -c "CREATE SCHEMA IF NOT EXISTS worldcup26;"
        
        # Run Python to auto-create the table and insert the data safely
        python -c "
        import pandas as pd
        from sqlalchemy import create_engine
        
        # Read the full CSV file
        df = pd.read_csv('tests/resources/players.csv')
        
        # Build the engine URL
        db_url = f'postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}'
        engine = create_engine(db_url)
        
        # Creates the structure AND inserts all rows safely
        df.to_sql('players', engine, schema='worldcup26', if_exists='replace', index=False)
        print('Table structure and data successfully imported via Pandas!')
        "

    - name: Run tests with pytest
      # Inject the GitHub Secrets as local environment variables for the test process
      env:
        PYTHONPATH: .
        HOST: 127.0.0.1
        PORT: 5432
        DATABASE: ${{ secrets.DB_NAME || 'test_db' }}
        PY_USER: ${{ secrets.DB_USER || 'postgres' }}
        PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
      run: |
        pytest
