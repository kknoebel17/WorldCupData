name: Run Pytest with Postgres

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Spin up a temporary PostgreSQL database container
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        # Ensure postgres is healthy before running the steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest python-dotenv psycopg2-binary
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Create database schema and tables
      env:
        PGPASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        # Create the schema
        psql -h localhost -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -c "CREATE SCHEMA IF NOT EXISTS worldcup26;"
        
        # Create the table matching your exact CSV columns (adjust data types as needed)
        psql -h localhost -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -c "
          CREATE TABLE IF NOT EXISTS worldcup26.players (
            id SERIAL PRIMARY KEY,
            name VARCHAR(255)
            -- Add your other CSV columns here (e.g., position VARCHAR(50), age INT)
          );"
        
        # Import the sample CSV data directly into the Postgres container
        psql -h localhost -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -c "\copy worldcup26.players FROM 'tests/resources/sample_player_data.csv' DELIMITER ',' CSV HEADER;"
    

    - name: Run tests with pytest
      # Inject the GitHub Secrets as local environment variables for the test process
      env:
        PYTHONPATH: .
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_PORT: 5432
      run: |
        pytest
